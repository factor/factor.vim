name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim

      - name: Run regression tests
        run: sh tests/run.sh
